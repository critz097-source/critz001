<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRITZ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
:root{
  --red: #e10600;
  --black: #0a0a0a;
  --white: #ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Anton', 'Arial Black', Arial, sans-serif}
body,html{height:100%;overflow-x:hidden; font-weight:400;}

.hero{position:relative;height:100vh;width:100%;overflow:hidden;color:var(--white)}
.bg-video{
  position:absolute;top:50%;left:50%;min-width:100%;min-height:100%;
  width:auto;height:auto;transform:translate(-50%,-50%);z-index:-2;object-fit:cover
}
.hero::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;
  background:linear-gradient(180deg, rgba(225,6,0,0.2) 0%, rgba(10,10,10,0.5) 100%);
}

/* GLASSY HEADER */
header{
  position:absolute;top:0;width:100%;padding:18px 25px;
  display:flex;justify-content:space-between;align-items:center;z-index:2;
  background: rgba(10, 10, 10, 0.2);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.15);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

/* GLASSY LOGO WRAP */
.logo-wrap{
  display:flex; flex-direction:column; align-items:flex-start; gap:3px;
  padding:8px 14px;
  background: rgba(225, 6, 0, 0.1);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.15);
}
.logo{
  font-size:24px; 
  font-weight:400; 
  letter-spacing:4px; 
  color:var(--white);
  text-shadow:0 0 15px rgba(225,6,0,0.8);
}
.location{
  font-size:9px; 
  letter-spacing:2.5px; 
  color:var(--white); 
  opacity:0.9;
  font-weight:400;
  text-transform:uppercase;
}
.location span{ color: var(--red); }

/* GLASSY NAV RIGHT */
.nav-right{
  display:flex;align-items:center;gap:12px;
  padding:8px 16px;
  background: rgba(10, 10, 10, 0.25);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.15);
}
.nav-right a{
  color:var(--white);text-decoration:none;transition:0.3s;
  font-size:12px; 
  font-weight:400; 
  letter-spacing:1.5px;
  padding:6px 10px;
  border-radius: 16px;
}
.nav-right a:hover{
  color:var(--red); 
  background: rgba(225,6,0,0.15);
  text-shadow:0 0 10px rgba(225,6,0,0.8)
}

.center-content{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:30px; text-align:center; padding:0 20px; width:100%;
}

/* CURVY GLASSY BUTTON */
.center-btn a{
  background: rgba(225, 6, 0, 0.15);
  color:var(--white);
  padding:18px 55px;
  border-radius: 50px;
  text-decoration:none;
  font-weight:400;
  letter-spacing:5px;
  font-size:15px;
  border: 1px solid rgba(255,255,255,0.25);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 
    0 8px 32px rgba(225,6,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.2);
  transition: all 0.4s ease;
  animation: glassPulse 3s infinite;
  display:inline-block;
  text-transform:uppercase;
}
.center-btn a:hover{
  background: rgba(255, 255, 255, 0.2);
  color:var(--red);
  border: 1px solid rgba(225,6,0,0.5);
  box-shadow: 
    0 8px 40px rgba(225,6,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.4);
  transform: translateY(-3px);
}

/* GLASSY SOCIALS BOX */
.socials{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  background: rgba(10, 10, 10, 0.25);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter: blur(25px);
  padding:14px 40px;
  border-radius:50px;
  z-index:2;
  display:flex;gap:30px;
  align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.2);
  opacity: 1;
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.15);
}
.socials a{
  color:var(--white);text-decoration:none;
  transition: all 0.3s ease; display:flex;align-items:center;justify-content:center;
}
.socials a svg{
  width: 26px; height: 26px; fill: white; transition: 0.3s;
}
.snap-s{
  width: 26px; height: 26px; 
  display:flex; align-items:center; justify-content:center;
  font-size: 22px; font-weight:400; letter-spacing:0;
  color:var(--white);
  transition: 0.3s;
}
.socials a:hover svg, .socials a:hover .snap-s{
  fill:var(--red); 
  color:var(--red);
  transform:translateY(-4px) scale(1.2);
  filter:drop-shadow(0 0 12px rgba(225,6,0,0.8))
}

@keyframes glassPulse{
 0%,100%{ box-shadow: 0 8px 32px rgba(225,6,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2) }
 50%{ box-shadow: 0 8px 40px rgba(225,6,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3) }
}
@keyframes fadeInDown{ from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
@keyframes expandLine{to{width:100%}}

@media(min-width: 768px){
  header{ padding: 22px 50px; }
  .logo{ font-size: 32px; letter-spacing: 6px; }
  .location{ font-size: 11px; letter-spacing: 3.5px; }
  .nav-right{ gap: 16px; }
  .nav-right a{ font-size: 13px; padding: 8px 14px; }
  .center-btn a{ padding: 20px 70px; font-size: 18px; letter-spacing: 6px; border-radius: 60px; }
  .socials{ padding: 16px 50px; gap: 35px; border-radius: 60px; }
  .socials a svg, .snap-s{ width: 30px; height: 30px; font-size: 26px; }
}
</style>
</head>
<body>
