<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRITZ - WEAR THE MOVEMENT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--red:#e10600}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-x:hidden;background:#000;font-family:'Inter',sans-serif}
.hero{position:relative;height:100vh;height:100dvh;width:100%;overflow:hidden;color:#fff;isolation:isolate}
.hero video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:-2;background:#000;
}
.hero::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg, rgba(225,6,0,0.12) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.88) 100%);
}
header{
  position:absolute;top:0;width:100%;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;z-index:5;
  background:rgba(0,0,0,0.25);border-bottom:1px solid rgba(225,6,0,0.4);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.logo{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:3px;text-shadow:0 0 18px var(--red);line-height:1;color:#fff}
.location{font-family:'Anton',sans-serif;font-size:7px;letter-spacing:1.6px;margin-top:2px;opacity:0.7;color:#fff}
.location span{color:var(--red)}
.nav-right{display:none}
.nav-right a{font-family:'Anton',sans-serif;color:#fff;text-decoration:none;font-size:11px;letter-spacing:2px}
.ham{width:28px;height:28px;display:flex;flex-direction:column;justify-content:center;gap:4px;cursor:pointer}
.ham span{width:100%;height:2px;background:#fff;display:block;border-radius:2px}

.center-content{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;
  width:92%;max-width:520px;text-align:center;padding:0 10px;
}
.slogan{
  font-family:'Anton',sans-serif;
  font-size:clamp(32px, 9vw, 58px);
  letter-spacing:clamp(1px, 0.8vw, 5px);
  line-height:0.9;color:var(--red);
  text-shadow:0 0 24px rgba(225,6,0,0.6), 0 3px 12px rgba(0,0,0,0.8);
}
.center-btn a{
  display:inline-block;background:rgba(225,6,0,0.18);color:#fff;
  padding:13px 34px;border-radius:50px;text-decoration:none;
  font-family:'Anton',sans-serif;letter-spacing:3px;font-size:11px;
  border:1px solid rgba(255,255,255,0.22);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:0.2s;
}
.center-btn a:active{transform:scale(0.96);background:var(--red)}

.socials{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));
  background:rgba(12,12,12,0.45);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:9px 18px;border-radius:50px;display:flex;gap:16px;
  border:1px solid rgba(255,255,255,0.14);z-index:3;align-items:center;
}
.socials a{display:flex;align-items:center;text-decoration:none}
.socials a svg{width:19px;height:19px;fill:#fff;display:block;opacity:0.9}
.snap-s{font-family:'Anton',sans-serif;font-size:17px;color:#fff;line-height:1}

/* MENU */
.m-menu{
  position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.m-menu.open{transform:translateX(0)}
.m-menu a{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:4px;color:#fff;text-decoration:none}
.m-menu a.active{color:var(--red)}
.close{position:absolute;top:18px;right:18px;font-size:36px;color:#fff;line-height:1;cursor:pointer;padding:10px}

@media(min-width:600px){
  header{padding:18px 24px;background:rgba(0,0,0,0.35);border-bottom:1.5px solid rgba(225,6,0,0.5)}
  .logo{font-size:24px;letter-spacing:4px}
  .location{font-size:8.5px;letter-spacing:2.2px}
  .nav-right{display:flex;gap:20px}
  .ham{display:none}
  .center-content{gap:28px}
  .center-btn a{padding:16px 48px;font-size:13px;letter-spacing:4px}
  .socials{padding:12px 28px;gap:26px;bottom:28px}
  .socials a svg{width:22px;height:22px}
  .snap-s{font-size:20px}
}
@media(min-width:1024px){
  .slogan{font-size:62px}
  header{padding:20px 36px}
}
</style>
</head>
