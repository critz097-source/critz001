<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>CRITZ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
:root{ --red:#e10600; }
*{margin:0;padding:0;box-sizing:border-box;font-family:'Anton', Arial, sans-serif}
body,html{height:100%;overflow-x:hidden;}
.hero{position:relative;height:100vh;width:100%;overflow:hidden;color:#fff}
.hero video{
  position:absolute;top:0;left:0;width:100%;height:100%;
  object-fit:cover;z-index:-2;
}
.hero::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;
  background:linear-gradient(180deg, rgba(225,6,0,0.15) 0%, rgba(0,0,0,0.75) 100%);
}
header{
  position:absolute;top:0;width:100%;padding:20px 25px;
  display:flex;justify-content:space-between;align-items:center;z-index:2;
  background: rgba(0,0,0,0.4); border-bottom:2px solid rgba(225,6,0,0.6);
  backdrop-filter: blur(5px);
}
.logo{font-size:24px;letter-spacing:4px;text-shadow:0 0 20px var(--red);}
.location{font-size:9px;letter-spacing:2.5px;margin-top:3px;}
.location span{color:var(--red);}
.nav-right{display:flex;gap:20px;}
.nav-right a{color:#fff;text-decoration:none;font-size:12px;letter-spacing:2px;}
.center-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center;width:100%;}
.slogan{font-size:28px;letter-spacing:5px;color:var(--red);text-shadow:0 0 25px var(--red);}
.center-btn a{background:rgba(225,6,0,0.15);color:#fff;padding:18px 55px;border-radius:50px;text-decoration:none;letter-spacing:5px;font-size:15px;border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(20px);}
.socials{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(10,10,10,0.25);backdrop-filter:blur(25px);padding:14px 40px;border-radius:50px;display:flex;gap:30px;border:1px solid rgba(255,255,255,0.2);z-index:2;align-items:center;}
.socials a svg{width:26px;height:26px;fill:#fff;}
.snap-s{font-size:22px;color:#fff;}
.socials a{text-decoration:none;color:#fff;display:flex;align-items:center;}
</style>
</head>
