<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORDER SUCCESS - STYLEVAULT</title>
<style>
:root{--red:#e10600;--black:#0a0a0a;--white:#fff;--green:#00c851;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Arial Black', Arial, sans-serif}
body{background:var(--black);color:var(--white);display:flex;justify-content:center;align-items:center;height:100vh;text-align:center}

.success-box{background:#111;padding:60px 40px;border-radius:20px;border:2px solid var(--green);max-width:500px}
.check{font-size:80px;color:var(--green);margin-bottom:20px;animation: pop 0.6s ease}
h1{font-size:32px;letter-spacing:3px;margin-bottom:15px}
p{color:#aaa;line-height:1.6;margin-bottom:25px}
.order-ref{background:#222;padding:15px;border-radius:8px;margin:20px 0;border:1px dashed var(--red)}
.btn{background:var(--red);color:var(--white);padding:15px 40px;border-radius:10px;text-decoration:none;font-weight:900;letter-spacing:2px;display:inline-block}
.btn:hover{background:var(--white);color:var(--red)}

@keyframes pop{
  0%{transform:scale(0)}
  60%{transform:scale(1.2)}
 100%{transform:scale(1)}
}
</style>
</head>
<body>

<div class="success-box">
  <div class="check">✓</div>
  <h1>ORDER PLACED!</h1>
  <p>Thank you <span id="userName" style="color:var(--red)"></span> for shopping with STYLEVAULT</p>

  <div class="order-ref">
    <div style="font-size:12px;color:#777">ORDER REFERENCE</div>
    <div id="orderRef" style="font-size:18px;letter-spacing:2px">SV000000</div>
  </div>

  <p>We'll contact you on WhatsApp/Email shortly to confirm your order and delivery details.</p>

  <a href="products.html" class="btn">CONTINUE SHOPPING</a>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem('stylevaultCurrentUser'));
let orderRef = localStorage.getItem('stylevaultOrderRef') || 'SV' + Math.floor(Math.random() * 1000000);

document.getElementById('userName').innerText = currentUser? currentUser.name.split(' ')[0].toUpperCase() : 'BBY';
document.getElementById('orderRef').innerText = orderRef;

// Clear ref after showing
localStorage.removeItem('stylevaultOrderRef');
</script>


</body>
</html>
